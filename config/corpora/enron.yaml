# TREC 2010 Legal Learning task judgments are sampled/stratified — metrics must
# use strata weights (see plan). UMD also hosts edrmv2txt-v2.tar.bz2 (dedup
# text-only rendition, 625 MB) and edrmv2nativeattach.tar.bz2 (~8 GB) if the
# XML natives ever prove insufficient.
chosen_topics: ["201"]
