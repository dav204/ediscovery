# EDRM Enron Email Data Set v2 (PII-cleaned) — PRIMARY corpus.
#
# SOURCING CORRECTION (2026-07-20): the v2 PST edition has NO live host — the
# original EDRM CloudFront/S3 URLs 404, edrm.net no longer lists any Enron set,
# and no vetted mirror of the PST zips exists. We therefore source the v2 XML
# EDITION from archive.org (item edrm.enron.email.data.set.v2.xml, the
# Searchdaimon mirror of the official EDRM v2 release, CC-BY-3.0-US per its
# README): per-custodian zips of EDRM XML load files + native/text bodies +
# attachments. Same corpus, same PII-cleaned v2 edition, different container.
# Upsides: no pypff/PST instability, and the XML carries the official EDRM v2
# DocIDs that the TREC 2010 Legal qrels reference — the idmap cascade collapses
# to a direct join (plan risk #1). archive.org publishes md5/sha1 per file
# (noted below); our own sha256 is pinned after first acquire.
#
# Ground truth: TREC 2010 Legal Track Learning task (topics 200-207; 201 =
# "Prepay transactions"). Qrels from trec.nist.gov; docid list + seed sets from
# the UMD mirror. Topic statements live in the track guidelines/overview +
# mock complaint (Wayback copies below — originals at plg.uwaterloo.ca 404).

corpus: enron
format: edrm-xml-v2
edition: v2                  # MUST be the v2 PII-cleaned edition (ethics rule)

custodians:
  - id: skilling-j
    display_name: Jeffrey Skilling
  - id: lay-k
    display_name: Kenneth Lay
  - id: kaminski-v
    display_name: Vince Kaminski

# archive.org md5s (from the item metadata manifest):
#   skilling-j 87bbdd2ba7c25402e7837b89ec74bb3f   lay-k 63dedc833ea1c05c8df58d45c8bc5b3f
#   kaminski-v_1of2 957ce8e45994f848b082d189eaa21a34   _2of2 75767bf2218c1c8371c54d48ca714f23
files:
